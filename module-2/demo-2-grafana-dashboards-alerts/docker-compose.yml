version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  broker1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker1
    depends_on:
      - zookeeper
    ports:
      - "19092:9092"
      - "19999:9999"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3

      # JMX (for JMX Exporter / Prometheus)
      KAFKA_JMX_HOSTNAME: broker1
      KAFKA_JMX_PORT: 9999
      JMX_PORT: 9999

  broker2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker2
    depends_on:
      - zookeeper
    ports:
      - "29092:9092"
      - "29999:9999"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3

      # JMX
      KAFKA_JMX_HOSTNAME: broker2
      KAFKA_JMX_PORT: 9999
      JMX_PORT: 9999

  broker3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker3
    depends_on:
      - zookeeper
    ports:
      - "39092:9092"
      - "39999:9999"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3

      # JMX
      KAFKA_JMX_HOSTNAME: broker3
      KAFKA_JMX_PORT: 9999
      JMX_PORT: 9999

  # JMX exporter sidecars (one per broker)
  jmx-exporter-broker1:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-broker1
    command:
      - "5556"
      - "/etc/jmx-exporter/kafka-broker.yml"
    volumes:
      - ./jmx-exporter/kafka-broker.yml:/etc/jmx-exporter/kafka-broker.yml:ro
    environment:
      JMX_EXPORTER_JMX_URL: "service:jmx:rmi:///jndi/rmi://broker1:9999/jmxrmi"
    ports:
      - "5556:5556"
    depends_on:
      - broker1

  jmx-exporter-broker2:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-broker2
    command:
      - "5556"
      - "/etc/jmx-exporter/kafka-broker.yml"
    volumes:
      - ./jmx-exporter/kafka-broker.yml:/etc/jmx-exporter/kafka-broker.yml:ro
    environment:
      JMX_EXPORTER_JMX_URL: "service:jmx:rmi:///jndi/rmi://broker2:9999/jmxrmi"
    ports:
      - "5557:5556"
    depends_on:
      - broker2

  jmx-exporter-broker3:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-broker3
    command:
      - "5556"
      - "/etc/jmx-exporter/kafka-broker.yml"
    volumes:
      - ./jmx-exporter/kafka-broker.yml:/etc/jmx-exporter/kafka-broker.yml:ro
    environment:
      JMX_EXPORTER_JMX_URL: "service:jmx:rmi:///jndi/rmi://broker3:9999/jmxrmi"
    ports:
      - "5558:5556"
    depends_on:
      - broker3

  # Kafka exporter for lag (Prometheus-friendly lag metrics)
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=broker1:9092"
      - "--kafka.server=broker2:9092"
      - "--kafka.server=broker3:9092"
      - "--group.filter=ops-demo-cg"
      - "--topic.filter=ops-demo-metrics"
    ports:
      - "9308:9308"
    depends_on:
      - broker1
      - broker2
      - broker3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - jmx-exporter-broker1
      - jmx-exporter-broker2
      - jmx-exporter-broker3
      - kafka-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
